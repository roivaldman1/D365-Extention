    <style>
      .brand-logo,
      .category-icon,
      .tool-icon {
        position: relative;
        isolation: isolate;
        overflow: hidden;
      }

      .brand-logo::before,
      .category-icon::before,
      .tool-icon::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background: linear-gradient(145deg, var(--icon-a), var(--icon-b));
      }

      .brand-logo::after,
      .category-icon::after,
      .tool-icon::after {
        content: "";
        position: absolute;
        width: 70%;
        height: 70%;
        top: -32%;
        right: -25%;
        z-index: -1;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        filter: blur(8px);
      }

      .brand-logo {
        --icon-a: #2563eb;
        --icon-b: #7c3aed;
        width: 46px;
        height: 46px;
        flex: 0 0 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 13px;
        color: #fff;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }

      .brand-logo svg {
        width: 27px;
        height: 27px;
      }

      .app-header {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .category-icon,
      .tool-icon {
        color: #fff !important;
        border-color: rgba(255, 255, 255, 0.2) !important;
        box-shadow: 0 7px 16px color-mix(in srgb, var(--icon-a) 28%, transparent), inset 0 1px 0 rgba(255,255,255,.2) !important;
      }

      .category-icon svg {
        width: 21px;
        height: 21px;
      }

      .tool-icon svg {
        width: 21px;
        height: 21px;
        stroke-width: 2;
      }

      .tool-card:hover .tool-icon {
        transform: translateY(-1px) scale(1.08) rotate(-2deg);
        border-color: rgba(255, 255, 255, 0.38) !important;
        box-shadow: 0 10px 22px color-mix(in srgb, var(--icon-a) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.3) !important;
      }

      .tool-card:hover .tool-icon::after {
        transform: translate(-7px, 7px);
      }

      .tool-icon::after {
        transition: transform 0.22s ease;
      }

      .tool-card {
        --card-glow: color-mix(in srgb, var(--icon-a) 22%, transparent);
      }

      .tool-card:hover {
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.32), 0 0 0 1px var(--card-glow), 0 0 22px var(--card-glow);
      }

      .tool-card::before {
        background: linear-gradient(180deg, var(--icon-a), var(--icon-b)) !important;
        box-shadow: 0 0 12px var(--icon-a);
      }
    </style>
  </head>
